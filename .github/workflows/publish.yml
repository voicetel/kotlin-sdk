name: Publish to Maven Central

# Publishes com.voicetel:voicetel-sdk-kotlin to Maven Central on every v* tag
# push, via the com.vanniktech.maven.publish plugin (Central Portal).
#
# Required repo secrets (same values as java-sdk):
#   CENTRAL_USERNAME        — Central Portal user token name
#   CENTRAL_PASSWORD        — Central Portal user token secret
#   MAVEN_GPG_PRIVATE_KEY   — ASCII-armored GPG private key
#   MAVEN_GPG_PASSPHRASE    — passphrase for the key

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish to Central Portal
        run: ./gradlew --no-configuration-cache publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
